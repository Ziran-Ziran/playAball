name: Godot checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Godot
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import and run behavior checks
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          "$GODOT" --version
          "$GODOT" --headless --path . --editor --import 2>&1 | tee /tmp/import.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' /tmp/import.log
          "$GODOT" --headless --path . --script tools/project_map.gd -- --check 2>&1 | tee /tmp/map.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' /tmp/map.log
          grep -q 'PROJECT MAP CHECK PASSED' /tmp/map.log
          "$GODOT" --headless --path . --script tests/smoke.gd 2>&1 | tee /tmp/smoke.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' /tmp/smoke.log
          grep -q 'ALL CHECKS PASSED' /tmp/smoke.log
          "$GODOT" --headless --path . --script tests/roguelite_smoke.gd 2>&1 | tee /tmp/roguelite.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' /tmp/roguelite.log
          grep -q 'ROGUELITE CHECKS PASSED' /tmp/roguelite.log
          "$GODOT" --headless --path . --script tests/roguelite_input_feedback.gd 2>&1 | tee /tmp/input-feedback.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' /tmp/input-feedback.log
          grep -q 'INPUT FEEDBACK CHECKS PASSED' /tmp/input-feedback.log
          for spec in enemies build boss run rice theme kill_rewards kill_run launch_rewards reward_effects; do
            "$GODOT" --headless --path . --script "tests/roguelite_${spec}.gd" 2>&1 | tee "/tmp/${spec}.log"
            ! grep -E '^(SCRIPT ERROR|ERROR):' "/tmp/${spec}.log"
          done
          grep -q 'ENEMY CHECKS PASSED' /tmp/enemies.log
          grep -q 'BUILD CHECKS PASSED' /tmp/build.log
          grep -qE 'ROGUELITE BOSS: [0-9]+ checks, 0 failures' /tmp/boss.log
          grep -q 'RUN CHECKS PASSED' /tmp/run.log
          grep -q 'RICE CHECKS PASSED' /tmp/rice.log
          grep -qE 'ROGUELITE THEME: [0-9]+ checks, 0 failures' /tmp/theme.log
          grep -q 'KILL REWARD CHECKS PASSED' /tmp/kill_rewards.log
          grep -q 'KILL RUN CHECKS PASSED' /tmp/kill_run.log
          grep -qE 'ROGUELITE LAUNCH REWARDS: [0-9]+ checks, 0 failures' /tmp/launch_rewards.log
          grep -q 'REWARD EFFECTS CHECKS PASSED' /tmp/reward_effects.log
