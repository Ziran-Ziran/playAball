name: Godot checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Godot
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import and run behavior checks
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          "$GODOT" --version
          "$GODOT" --headless --path . --editor --import 2>&1 | tee /tmp/import.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' /tmp/import.log
          "$GODOT" --headless --path . --script tools/project_map.gd -- --check 2>&1 | tee /tmp/map.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' /tmp/map.log
          grep -q 'PROJECT MAP CHECK PASSED' /tmp/map.log
          "$GODOT" --headless --path . --script tests/smoke.gd 2>&1 | tee /tmp/smoke.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' /tmp/smoke.log
          grep -q 'ALL CHECKS PASSED' /tmp/smoke.log
