name: Godot checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Godot
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import and run behavior checks
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          "$GODOT" --version
          "$GODOT" --headless --path . --editor --import 2>&1 | tee /tmp/import.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' /tmp/import.log
          "$GODOT" --headless --path . --script tools/project_map.gd -- --check 2>&1 | tee /tmp/map.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' /tmp/map.log
          grep -q 'PROJECT MAP CHECK PASSED' /tmp/map.log
          "$GODOT" --headless --path . --script tests/smoke.gd 2>&1 | tee /tmp/smoke.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' /tmp/smoke.log
          grep -q 'ALL CHECKS PASSED' /tmp/smoke.log
          "$GODOT" --headless --path . --script tests/roguelite_smoke.gd 2>&1 | tee /tmp/roguelite.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' /tmp/roguelite.log
          grep -q 'ROGUELITE CHECKS PASSED' /tmp/roguelite.log
          "$GODOT" --headless --path . --script tests/roguelite_input_feedback.gd 2>&1 | tee /tmp/input-feedback.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' /tmp/input-feedback.log
          grep -q 'INPUT FEEDBACK CHECKS PASSED' /tmp/input-feedback.log
          "$GODOT" --headless --path . --script tests/roguelite_presentation_interface.gd 2>&1 | tee /tmp/presentation-interface.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' /tmp/presentation-interface.log
          grep -q 'PRESENTATION INTERFACE CHECKS PASSED' /tmp/presentation-interface.log
          "$GODOT" --headless --path . --script tests/roguelite_gameplay_lab.gd 2>&1 | tee /tmp/gameplay-lab.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' /tmp/gameplay-lab.log
          grep -q 'GAMEPLAY LAB CHECKS PASSED' /tmp/gameplay-lab.log
          "$GODOT" --headless --path . --script tests/roguelite_live_tuning.gd 2>&1 | tee /tmp/live-tuning.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' /tmp/live-tuning.log
          grep -q 'LIVE TUNING CHECKS PASSED' /tmp/live-tuning.log
          "$GODOT" --headless --path . --script tests/roguelite_full_tuning.gd 2>&1 | tee /tmp/full-tuning.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' /tmp/full-tuning.log
          grep -q 'FULL TUNING CHECKS PASSED' /tmp/full-tuning.log
          for spec in enemies build boss run rice theme kill_rewards kill_run launch_rewards reward_effects audio hud feedback_integration stage_flow shop_events crowd difficulty damage_contacts enemy_readability splitting map_mechanisms portals maps map_flow map_navigation balance_metrics fish_view actor_views; do
            "$GODOT" --headless --path . --script "tests/roguelite_${spec}.gd" 2>&1 | tee "/tmp/${spec}.log"
            ! grep -E '^(SCRIPT ERROR|ERROR):' "/tmp/${spec}.log"
          done
          grep -q 'ENEMY CHECKS PASSED' /tmp/enemies.log
          grep -q 'BUILD CHECKS PASSED' /tmp/build.log
          grep -q 'MAP MECHANISM CHECKS PASSED' /tmp/map_mechanisms.log
          grep -q 'PORTAL CHECKS PASSED' /tmp/portals.log
          grep -q 'MAP CHECKS PASSED' /tmp/maps.log
          grep -q 'MAP FLOW CHECKS PASSED' /tmp/map_flow.log
          grep -q 'MAP NAVIGATION CHECKS PASSED' /tmp/map_navigation.log
          grep -q 'BALANCE METRIC CHECKS PASSED' /tmp/balance_metrics.log
          grep -q 'FISH VIEW CHECKS PASSED' /tmp/fish_view.log
          grep -q 'ACTOR VIEW CHECKS PASSED' /tmp/actor_views.log
          grep -qE 'ROGUELITE BOSS: [0-9]+ checks, 0 failures' /tmp/boss.log
          grep -q 'RUN CHECKS PASSED' /tmp/run.log
          grep -q 'RICE CHECKS PASSED' /tmp/rice.log
          grep -qE 'ROGUELITE THEME: [0-9]+ checks, 0 failures' /tmp/theme.log
          grep -q 'KILL REWARD CHECKS PASSED' /tmp/kill_rewards.log
          grep -q 'KILL RUN CHECKS PASSED' /tmp/kill_run.log
          grep -qE 'ROGUELITE LAUNCH REWARDS: [0-9]+ checks, 0 failures' /tmp/launch_rewards.log
          grep -q 'REWARD EFFECTS CHECKS PASSED' /tmp/reward_effects.log
          grep -qE 'Audio checks: [0-9]+, failures: 0' /tmp/audio.log
          grep -q 'HUD CHECKS PASSED' /tmp/hud.log
          grep -q 'FEEDBACK INTEGRATION CHECKS PASSED' /tmp/feedback_integration.log
          grep -q 'STAGE FLOW CHECKS PASSED' /tmp/stage_flow.log
          grep -q 'SHOP EVENT CHECKS PASSED' /tmp/shop_events.log
          grep -q 'CROWD CHECKS PASSED' /tmp/crowd.log
          grep -q 'DIFFICULTY CHECKS PASSED' /tmp/difficulty.log
          grep -q 'DAMAGE CONTACT CHECKS PASSED' /tmp/damage_contacts.log
          grep -q 'ENEMY READABILITY CHECKS PASSED' /tmp/enemy_readability.log
          grep -q 'SPLITTING CHECKS PASSED' /tmp/splitting.log
          for spec in paddle_response feature_acceptance; do
            "$GODOT" --headless --fixed-fps 120 --path . --script "tests/roguelite_${spec}.gd" 2>&1 | tee "/tmp/${spec}.log"
            ! grep -E '^(SCRIPT ERROR|ERROR):' "/tmp/${spec}.log"
          done
          grep -qE 'PADDLE RESPONSE CHECKS PASSED: [0-9]+ failures: 0' /tmp/paddle_response.log
          grep -qE 'FEATURE ACCEPTANCE CHECKS PASSED: [0-9]+ failures: 0' /tmp/feature_acceptance.log
      - name: UI integration
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script tests/ui_integration.gd 2>&1 | tee /tmp/ui-integration.log
          ! grep -E "^(SCRIPT ERROR|ERROR):" /tmp/ui-integration.log
          grep -q "UI INTEGRATION CHECKS PASSED" /tmp/ui-integration.log
